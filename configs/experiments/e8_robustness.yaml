
experiment:
  id: E8
  name: robustness
  phase: final_evaluation_preparation

execution:
  status: tooling_only
  official_evaluation_enabled: false

model:
  selection_config: configs/model_selection.yaml

corruptions:
  enabled:
    - gaussian_blur
    - gaussian_noise
    - occlusion

  deterministic: true
  preserve_image_size: true
  preserve_label: true

severity:
  status: pending_approval
  gaussian_blur: null
  gaussian_noise: null
  occlusion: null

evaluation:
  metric: top1_accuracy
  report_accuracy_drop: true
  accuracy_drop_formula: clean_minus_corrupted

testing:
  synthetic_inputs_allowed: true
  official_test_allowed: false

restrictions:
  train_new_model: false
  modify_checkpoint: false
  use_official_test: false
